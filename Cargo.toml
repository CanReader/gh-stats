[package]
name = "gh-stats"
version = "0.3.0"
edition = "2021"
description = "GitHub stats for any user or org, right in your terminal"
license = "MIT"

[[bin]]
name = "gh-stats"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
