[package]
name = "gh-stats-cli"
version = "0.1.0"
edition = "2021"
description = "Show a GitHub user's repos, stars and languages in the terminal"
license = "MIT"

[[bin]]
name = "gh-stats"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
